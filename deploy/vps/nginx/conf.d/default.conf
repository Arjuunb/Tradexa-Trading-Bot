# ── PHASE A: bootstrap (HTTP only) ───────────────────────────────────────────
# This is the ACTIVE config until the first certificate exists. It does two
# things at once, and both matter:
#
#   1. Serves the ACME HTTP-01 challenge from the shared certbot webroot, so
#      Let's Encrypt can prove you control the domain.
#   2. Keeps the HTTP site fully working by proxying everything else to the app
#      — so requesting the certificate does not take the site down (requirement
#      5).
#
# There is deliberately NO `ssl_certificate` directive here. nginx refuses to
# start if it references a cert file that does not exist yet, so the HTTPS
# server block cannot be added until the cert is on disk. That is the whole
# reason this is a two-phase switch: bootstrap first, then activate TLS.
#
# After the certificate is issued you replace this file with `default.conf.tls`
# and reload — see docs/DEPLOYMENT_VPS.md.

server {
    listen 80;
    listen [::]:80;
    server_name trade-logx.com www.trade-logx.com;

    # ACME HTTP-01. `^~` wins over regex locations and stops nginx looking
    # further, so a challenge file is never accidentally proxied to the app.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Lightweight liveness endpoint for the container health check. Answered by
    # nginx itself so it does not depend on the app being up.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Everything else → the FastAPI app. Same reverse proxy the working HTTP
    # site already uses; nothing about the app changes.
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

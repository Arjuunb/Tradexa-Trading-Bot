apiVersion: 1

providers:
  - name: tradexa
    orgId: 1
    folder: Tradexa
    type: file
    # Editable in the UI for exploration, but the files on disk are the source
    # of truth and are restored on every restart — so an experiment can never
    # quietly become the dashboard everyone relies on.
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

# External Secrets Operator — the recommended way to supply credentials.
#
# NOT in kustomization.yaml. It requires the ESO CRDs, and applying it without
# them fails the whole apply. Add it to the overlay's `resources:` once the
# operator is installed:
#
#     helm repo add external-secrets https://charts.external-secrets.io
#     helm install external-secrets external-secrets/external-secrets \
#       -n external-secrets --create-namespace
#
# Why this rather than a committed Secret: nothing sensitive ever reaches git,
# rotation happens in the secret store and propagates on the refresh interval
# without a deploy, and access is audited by the cloud provider rather than by
# whoever has clone rights on the repository.
#
# The example targets AWS Secrets Manager. Vault, GCP Secret Manager and Azure
# Key Vault work the same way — only the SecretStore provider block changes.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: tradexa-secret-store
  namespace: tradexa
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        # IRSA: the pod's ServiceAccount is annotated with an IAM role, so no
        # static AWS credentials exist anywhere in the cluster. This is the
        # whole point — a stolen pod token grants nothing outside its role.
        jwt:
          serviceAccountRef:
            name: tradexa-hub
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tradexa-hub-secrets
  namespace: tradexa
spec:
  # Re-reads the source hourly, so a rotation propagates without a deploy.
  # NOTE: the running pods do not pick up the new value until they restart —
  # the Secret name carries no content hash. Follow a rotation with a
  # `kubectl rollout restart`, or run stakater/Reloader to automate it.
  refreshInterval: 1h
  secretStoreRef:
    name: tradexa-secret-store
    kind: SecretStore
  target:
    # Must match the secretRef name in the workloads.
    name: tradexa-hub-secrets
    creationPolicy: Owner
  data:
    - secretKey: HUB_SECRET
      remoteRef:
        key: tradexa/hub
        property: session_secret
    - secretKey: HUB_USERNAME
      remoteRef:
        key: tradexa/hub
        property: admin_username
    - secretKey: HUB_PASSWORD
      remoteRef:
        key: tradexa/hub
        property: admin_password
    - secretKey: HUB_WEBHOOK_SECRET
      remoteRef:
        key: tradexa/hub
        property: webhook_secret
    - secretKey: HUB_API_KEY
      remoteRef:
        key: tradexa/hub
        property: api_key
    - secretKey: HUB_METRICS_TOKEN
      remoteRef:
        key: tradexa/hub
        property: metrics_token
    - secretKey: SUPABASE_URL
      remoteRef:
        key: tradexa/hub
        property: supabase_url
    - secretKey: SUPABASE_KEY
      remoteRef:
        key: tradexa/hub
        property: supabase_key

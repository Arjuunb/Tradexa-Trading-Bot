# TEMPLATE ONLY — this file contains no real credentials and must never contain
# any. It is committed so the required keys are discoverable; the values are
# placeholders.
#
# Pick one of three ways to supply the real thing. In rough order of preference:
#
# 1. External Secrets Operator (externalsecret.yaml, in this directory).
#    The cluster pulls from AWS Secrets Manager / Vault / GCP Secret Manager and
#    materialises a Secret. Nothing sensitive touches git, and rotation in the
#    source propagates automatically. This is the recommended path.
#
# 2. Sealed Secrets. Encrypt with the cluster's public key and commit the
#    ciphertext, which only the in-cluster controller can decrypt:
#
#      kubeseal --format yaml < secret.yaml > sealedsecret.yaml
#
# 3. Created out of band, imperatively, and never committed at all:
#
#      kubectl -n tradexa create secret generic tradexa-hub-secrets \
#        --from-literal=HUB_SECRET="$(openssl rand -hex 32)" \
#        --from-literal=HUB_PASSWORD='...' \
#        --from-literal=HUB_WEBHOOK_SECRET="$(openssl rand -hex 32)" \
#        --from-literal=HUB_API_KEY="$(openssl rand -hex 32)"
#
# HUB_SECRET signs session cookies. The application refuses to boot if it is
# left at the development default on a cloud host, because a known signing key
# makes session forgery trivial — generate it, never type it.
apiVersion: v1
kind: Secret
metadata:
  name: tradexa-hub-secrets
  namespace: tradexa
type: Opaque
stringData:
  # openssl rand -hex 32
  HUB_SECRET: "REPLACE_ME_generate_with_openssl_rand_hex_32"
  # Dashboard operator login.
  HUB_USERNAME: "admin"
  HUB_PASSWORD: "REPLACE_ME_strong_password"
  # Shared with TradingView, so treated as the most likely to leak.
  HUB_WEBHOOK_SECRET: "REPLACE_ME_generate_with_openssl_rand_hex_32"
  # Control credential, deliberately DIFFERENT from the webhook secret. With
  # HUB_SCOPE_WEBHOOK=1 the webhook secret can then post alerts but cannot
  # control the account, so a leaked TradingView secret is not account access.
  HUB_API_KEY: "REPLACE_ME_generate_with_openssl_rand_hex_32"
  HUB_SCOPE_WEBHOOK: "1"
  # Guards /metrics when it is reachable from outside the cluster. The
  # NetworkPolicy already restricts it to the monitoring namespace, so this is
  # a second layer rather than the only one.
  HUB_METRICS_TOKEN: "REPLACE_ME_generate_with_openssl_rand_hex_32"
  # Optional durable stores. Leave empty to run on the PersistentVolume only.
  SUPABASE_URL: ""
  SUPABASE_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""

# The hub never calls the Kubernetes API, so it is given an identity with no
# permissions and no token.
#
# automountServiceAccountToken: false is the part that matters. By default every
# pod gets a mounted API credential whether it needs one or not, and that token
# is the first thing worth stealing in a container escape or an SSRF. Removing
# it costs nothing here because there is nothing in the cluster this workload is
# supposed to talk to.
#
# No Role or RoleBinding accompanies this on purpose: least privilege for a
# workload that needs no privilege is no RBAC at all, and an empty Role would
# only invite someone to add a rule to it later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tradexa-hub
  namespace: tradexa
automountServiceAccountToken: false
